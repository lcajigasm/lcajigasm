<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Luis Cajigas — CTO · OSS maker · Madrid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb43d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d0d7de"/>
    </pattern>
    <clipPath id="r"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect x="620" width="380" height="240" fill="url(#dots)"/>
    <circle cx="905" cy="-20" r="170" fill="url(#ac)" opacity="0.13"/>
    <circle cx="960" cy="250" r="110" fill="url(#ac)" opacity="0.10"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="18" fill="none" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="72" font-size="15" font-weight="600" letter-spacing="3" fill="#e8590c">HI, I’M</text>
    <text x="62" y="128" font-size="52" font-weight="800" letter-spacing="-1" fill="#1f2328">Luis Cajigas</text>
    <rect x="64" y="146" width="56" height="4" rx="2" fill="url(#ac)"/>
    <text x="64" y="184" font-size="19" font-weight="500" fill="#59636e">CTO · OSS maker · DevOps &amp; IoT geek · Madrid</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#59636e">
    <text x="936" y="206" text-anchor="end"><tspan fill="#e8590c">$</tspan> ship --beats perfect</text>
  </g>
</svg>
